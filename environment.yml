name: agentloop
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip>=24.0
  - pip:
      # Everything else comes from pyproject.toml. Editable, so your source
      # changes take effect without reinstalling.
      #
      # One environment per repository. Chapter 13's `harness` repo gets its own,
      # which is the split made physical: an environment holding both packages
      # can no longer tell you whether the library stands on its own.
      - -e .[all,dev]
