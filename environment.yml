name: agentloop
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip>=24.0
  - ipykernel
  - jupyterlab
  - pip:
      # Everything else comes from pyproject.toml. Editable, so your source
      # changes take effect without reinstalling.
      #
      # One environment per repository: a shared one can no longer tell you whether
      # this library stands on its own.
      - -e .[all,dev]
