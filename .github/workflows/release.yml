name: Release

# Tag vX.Y.Z -> verify -> build once -> PyPI (Trusted Publishing; the tag IS the release
# decision, there is no approval gate) -> GitHub Release carrying the SAME files.
#
# Dry run: Actions -> Release -> Run workflow on any branch publishes to TestPyPI only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Tag must match pyproject.toml and __version__
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import os, re, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          init = re.search(r'__version__ = "([^"]+)"',
                           open("src/agentloop/__init__.py").read()).group(1)
          assert tag == project == init, f"tag={tag} pyproject={project} __init__={init}"
          PY
      - name: Changelog has an entry for this version
        if: github.ref_type == 'tag'
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md
      - run: pip install -e ".[all,dev]"
      - run: ruff check . && mypy && pytest -q --cov --cov-fail-under=88
      - run: bash scripts/test-wheel.sh
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    # Manual dry run only. TestPyPI versions are immutable too: bump the version to retry.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write          # Trusted Publishing; no API token anywhere
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - run: rm dist/SHA256SUMS      # not a distribution file
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi            # must match the trusted publisher configured on PyPI
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - run: rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --verify-tag \
            --notes "Published to PyPI as based-models-agentloop ${GITHUB_REF_NAME#v}. See CHANGELOG.md."
