[project]
name = "based-models-agentloop"
version = "0.5.0"
description = "A reliable Python agent loop with tools, retries, transcripts, and observability."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["llm", "agent", "agent-loop", "tool-use", "anthropic", "openai", "opentelemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.7",
    "opentelemetry-api>=1.30",
]

[project.optional-dependencies]
anthropic     = ["anthropic>=1.0"]
openai-compat = ["httpx>=0.27"]
otel          = ["opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-http>=1.30"]
all           = ["based-models-agentloop[anthropic,openai-compat,otel]"]
# The test suite needs the OTel SDK (test_tracing.py exercises a real exporter);
# the LIBRARY does not. Without this, `pip install -e ".[dev]"` gives you a suite
# that fails at collection, and only `[all,dev]` happens to work.
dev           = [
    "pytest>=8", "pytest-cov>=5", "mypy>=1.11", "ruff>=0.6",
    "build>=1.2", "twine>=5", "pip-audit>=2.7", "pre-commit>=3.7",
    "based-models-agentloop[otel]",
]

[project.urls]
Repository = "https://github.com/based-models/agent-loop"
Changelog = "https://github.com/based-models/agent-loop/blob/main/CHANGELOG.md"

# No [project.scripts]: agentloop is a library and has no command.
#
# No pydantic-settings, deliberately: its whole job is reaching os.environ, which
# is the thing the layering test bans `os` for. Settings.from_env() takes the
# mapping instead. scripts/test-wheel.sh asserts the dependency is absent.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentloop"]

[tool.hatch.build.targets.sdist]
include = ["src/agentloop", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["agentloop"]
branch = true
